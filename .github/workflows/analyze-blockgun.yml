name: Recursive Block Gun inventory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-blockgun.yml"
      - "tools/deep_inventory.py"
      - "tools/unity_asset_audit.py"
      - "tools/unity_scene_graph.py"
      - "tools/build_godot_preview.py"
      - "tools/build_godot_all_maps.py"
      - "tools/map_quality_audit.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/analyze-blockgun.yml"
      - "tools/deep_inventory.py"
      - "tools/unity_asset_audit.py"
      - "tools/unity_scene_graph.py"
      - "tools/build_godot_preview.py"
      - "tools/build_godot_all_maps.py"
      - "tools/map_quality_audit.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip
      - name: Download original archive
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/Pedra12/Engenharia-reversa-/releases/download/V1.0/Block%2BGun%2B3D_%2BFPS%2BShooter%2BPvP_2.0.3_APKPure.apk_Decompiler.com.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o blockgun.zip
          echo "Downloaded bytes: $(stat -c%s blockgun.zip)"
          sha256sum blockgun.zip
      - name: Compute extraction cache key
        id: extraction-key
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT="$(sha256sum blockgun.zip tools/deep_inventory.py tools/unity_asset_audit.py tools/unity_scene_graph.py | sha256sum | cut -d ' ' -f1)"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
      - name: Restore extracted Unity assets and scene graph
        id: extracted-cache
        uses: actions/cache@v4
        with:
          path: |
            inventory_out/
            unity_audit/
            scene_graph/
          key: blockgun-extraction-${{ steps.extraction-key.outputs.fingerprint }}-v1
      - name: Run recursive inventory
        if: steps.extracted-cache.outputs.cache-hit != 'true'
        run: python3 tools/deep_inventory.py
      - name: Install Unity extraction libraries
        if: steps.extracted-cache.outputs.cache-hit != 'true'
        run: python3 -m pip install --disable-pip-version-check UnityPy Pillow
      - name: Extract and catalog Unity assets
        if: steps.extracted-cache.outputs.cache-hit != 'true'
        run: python3 tools/unity_asset_audit.py
      - name: Build relational Unity scene graph
        if: steps.extracted-cache.outputs.cache-hit != 'true'
        run: python3 tools/unity_scene_graph.py
      - name: Install image library for map icon generation
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Generate Godot project with all recovered maps
        run: python3 tools/build_godot_all_maps.py
      - name: Audit every map assets, interiors and stair candidates
        run: python3 tools/map_quality_audit.py
      - name: Preserve map audit data even if validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlockGun-Map-Diagnostics
          path: |
            inventory_out/*QUALITY_AUDIT*
            inventory_out/BLOCKGUN_MAP_QUALITY_AUDIT.*
            godot_project/data/*.json
            /tmp/map-audit.log
          if-no-files-found: warn
          retention-days: 30
      - name: Validate generated project with Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path godot_project --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eq "Failed loading resource|SCRIPT ERROR:|Parse Error:" /tmp/godot-import.log; then
            echo "One or more project resources failed to import."
            exit 1
          fi
          set +e
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot_project --quit-after 8 2>&1 | tee /tmp/godot-runtime.log
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "Godot runtime exited with status $GODOT_STATUS"
            exit "$GODOT_STATUS"
          fi
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource" /tmp/godot-runtime.log; then
            echo "Godot script errors detected; refusing to export a broken APK."
            exit 1
          fi
          grep -q "BLOCKGUN_BOOT_OK" /tmp/godot-runtime.log
          grep -q "MAP_LOADED lvl_forest" /tmp/godot-runtime.log
          echo "Startup and default map load verified."
          set +e
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot_project -- --audit-all-maps 2>&1 | tee /tmp/map-audit.log
          MAP_AUDIT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$MAP_AUDIT_STATUS" -ne 0 ]; then
            echo "One or more recovered maps failed the scene/collision audit."
            exit "$MAP_AUDIT_STATUS"
          fi
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource" /tmp/map-audit.log; then
            echo "Godot script errors detected during map audit."
            exit 1
          fi
          grep -q "BLOCKGUN_ALL_MAPS_AUDIT_OK count=9" /tmp/map-audit.log
          if grep -q "No project icon specified" /tmp/godot-runtime.log; then
            echo "Android project icon is still missing."
            exit 1
          fi
          echo "All nine maps and their collision resources passed automated audit."
      - name: Install Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER" -a -x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          if [ -d "$HOME/.local/share/godot/export_templates/4.4.1.stable/templates" ]; then
            cp -a "$HOME/.local/share/godot/export_templates/4.4.1.stable/templates/." "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
            rm -rf "$HOME/.local/share/godot/export_templates/4.4.1.stable/templates"
          fi
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          android/android_sdk_path = "$ANDROID_HOME"
          android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Export Android preview APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" godot_project/build
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path godot_project --export-debug Android "$GITHUB_WORKSPACE/godot_project/build/BlockGunMapsPreview.apk" 2>&1 | tee /tmp/android-export.log
          if grep -Eq "No project icon specified|Failed loading resource|SCRIPT ERROR:|Parse Error:" /tmp/android-export.log; then
            echo "Android export reported a fatal resource or icon warning."
            exit 1
          fi
          test -s godot_project/build/BlockGunMapsPreview.apk
          ls -lh godot_project/build/BlockGunMapsPreview.apk
      - name: Upload Android preview APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockGun-Android-Preview-APK
          path: godot_project/build/BlockGunMapsPreview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish summary
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'inventory_out/BLOCKGUN_DEEP_INVENTORY.md';
            const content = Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: 'BLOCKGUN_DEEP_INVENTORY.md', ref: 'main'});
              sha = existing.data.sha;
            } catch (e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path: 'BLOCKGUN_DEEP_INVENTORY.md',
              message: 'Publish recursive inventory of Block Gun archive',
              content, ...(sha ? {sha} : {}), branch: 'main'
            });
      - name: Upload full inventories
        uses: actions/upload-artifact@v4
        with:
          name: BlockGun-Complete-Recursive-Inventory
          path: |
            inventory_out/
            unity_audit/
            scene_graph/
            godot_project/
          if-no-files-found: error
          retention-days: 30
