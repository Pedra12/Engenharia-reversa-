name: Analyze Block Gun archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-blockgun.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download release archive
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/Pedra12/Engenharia-reversa-/releases/download/V1.0/Block%2BGun%2B3D_%2BFPS%2BShooter%2BPvP_2.0.3_APKPure.apk_Decompiler.com.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o blockgun.zip
          echo "Downloaded bytes: $(stat -c%s blockgun.zip)"
          sha256sum blockgun.zip
      - name: Deep inventory and readiness checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, collections, os, re
          z=zipfile.ZipFile('blockgun.zip')
          infos=z.infolist()
          names=[i.filename for i in infos if not i.is_dir()]
          sizes={i.filename:i.file_size for i in infos}
          ext=collections.Counter(os.path.splitext(n)[1].lower() or '[sem extensão]' for n in names)
          out=['# Relatório técnico aprofundado: Block Gun 3D 2.0.3','']
          out += [f'- Arquivos: {len(names)}',f'- Tamanho descompactado: {sum(i.file_size for i in infos):,} bytes',f'- Tamanho ZIP: {os.path.getsize("blockgun.zip"):,} bytes','']
          out += ['## Diagnóstico de prontidão']
          checks=[
           ('Projeto Unity editável (ProjectSettings + Packages/manifest.json)', any(n.endswith('ProjectSettings/ProjectVersion.txt') for n in names) and any(n.endswith('Packages/manifest.json') for n in names)),
           ('Cenas Unity originais (.unity)', any(n.lower().endswith('.unity') for n in names)),
           ('Prefabs Unity originais (.prefab)', any(n.lower().endswith('.prefab') for n in names)),
           ('Modelos OBJ recuperados', ext['.obj']>0),
           ('Modelos FBX/GLTF/GLB recuperados', sum(ext[x] for x in ['.fbx','.gltf','.glb'])>0),
           ('Scripts C# recuperados', ext['.cs']>0),
           ('Dump IL2CPP recuperado', any('script.json' in n or 'dump.cs' in n for n in names)),
           ('Dependências Unity declaradas (manifest.json)', any(n.endswith('Packages/manifest.json') for n in names)),
           ('Projeto C# (csproj)', ext['.csproj']>0),
           ('Manifest Android recuperado', any(n.endswith('AndroidManifest.xml') for n in names)),
          ]
          for label,ok in checks: out.append(f'- {"[SIM]" if ok else "[NÃO]"} {label}')
          out += ['', '## Extensões e volumes']+[f'- {k}: {v}' for k,v in ext.most_common(70)]
          out += ['', '## Arquivos de configuração e documentação']
          config=[n for n in names if re.search(r'(README|NOTES|\.csproj$|manifest\.json$|ProjectVersion\.txt$|\.asmdef$|\.meta$)',n,re.I)]
          out += [f'- {n} ({sizes[n]:,} bytes)' for n in config[:250]]
          out += ['', '## Distribuição dos recursos Unity']
          unity=[n for n in names if n.startswith('unity/')]
          groups=collections.Counter('/'.join(n.split('/')[:3]) for n in unity)
          out += [f'- {k}: {v}' for k,v in groups.most_common(100)]
          out += ['', '## Amostra de modelos 3D OBJ']
          objs=[n for n in names if n.lower().endswith('.obj')]
          out += [f'- {n} ({sizes[n]:,} bytes)' for n in sorted(objs,key=lambda n:sizes[n],reverse=True)[:100]]
          out += ['', '## Amostra de sprites e texturas']
          imgs=[n for n in names if os.path.splitext(n)[1].lower() in ['.png','.jpg','.jpeg','.webp']]
          out += [f'- {n} ({sizes[n]:,} bytes)' for n in sorted(imgs,key=lambda n:sizes[n],reverse=True)[:80]]
          out += ['', '## Scripts centrais e tamanho']
          terms=['PlayerController','AIController','WeaponBase','WeaponManager','WeaponLoader','PhotonManager','PhotonCharacterBase','TeamDeathMatchMode','FreeForAllMode','EliminationMode','BombMode','MapSelector','SpawnPointManager','InputManager','MouseLook','TouchButtonInteractable','PlayerUIController','LocalAnimator','MoveJoystickRunAbility','CameraIdentity','Crosshair','FootStepsLibrary']
          cs=[n for n in names if n.startswith('unity/scripts/csharp/') and n.endswith('.cs')]
          for term in terms:
           for p in [n for n in cs if term.lower() in os.path.basename(n).lower()][:5]: out.append(f'- {p}: {sizes[p]:,} bytes')
          out += ['', '## Documentação/dump']
          docs=[n for n in names if n.lower().endswith(('.txt','.md','.csproj')) or n.endswith('ProjectVersion.txt') or n.endswith('manifest.json')]
          for p in docs[:20]:
           try: s=z.read(p)[:10000].decode('utf-8','replace')
           except: continue
           out += [f'### {p}', s[:4000], '']
          out += ['## Conclusão e próximos requisitos',
           '- O ZIP é uma extração/decompilação extensa, não um projeto Unity original pronto: o projeto editável exige cenas, prefabs, ProjectSettings, versão do editor e manifesto de pacotes.',
           '- Os arquivos OBJ são malhas geométricas; verificar material, UV, rig, esqueleto e animações é necessário antes de usar personagens em jogo.',
           '- Dados serializados e dump IL2CPP ajudam a reconstruir referências, mas não equivalem a cenas/prefabs restaurados.',
           '- Para um APK próprio será necessário montar projeto Unity/Godot independente, reimplementar sistemas necessários e validar dependências/licenças.',
           '- Multiplayer Photon: código cliente identificado, mas servidores, credenciais e compatibilidade de backend não foram confirmados.']
          open('BLOCKGUN_ANALYSIS.md','w',encoding='utf-8').write('\n'.join(out)+'\n')
          print('\n'.join(out[:220]))
          PY
      - name: Publish report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'BLOCKGUN_ANALYSIS.md';
            const content = Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
              sha = existing.data.sha;
            } catch (e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path,
              message: 'Add deep technical readiness assessment for Block Gun archive',
              content, ...(sha ? {sha} : {}), branch: 'main'
            });
